name = "naming-police-api"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[[routes]]
pattern = "api.renamer.diegodella.ar"
custom_domain = true

[vars]
OPENAI_MODEL = "gpt-5.6-luna"
MONTHLY_QUOTA = "100"
MAX_PAYLOAD_BYTES = "2097152"
ALLOWED_ORIGIN = "tauri://localhost,http://tauri.localhost,https://tauri.localhost,https://renamer.diegodella.ar"
NOMINATIM_BASE_URL = "https://nominatim.openstreetmap.org"
ADMIN_EMAILS = "diego@diegodella.ar"
DOWNLOAD_MANIFEST_URL = "https://downloads.renamer.diegodella.ar/release.json"

[observability.logs]
enabled = true
head_sampling_rate = 1
